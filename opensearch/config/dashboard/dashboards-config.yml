server.name: opensearch-dashboards
server.host: "0.0.0.0"
server.port: 5601

opensearch.hosts: ["https://opensearch-node1:9200"]
opensearch.username: "admin"
opensearch.password: "${OPENSEARCH_PASSWORD}"

opensearch.ssl.verificationMode: full

server.ssl.enabled: false

opensearch.requestHeadersWhitelist: ["securitytenant","Authorization"]

opensearch_security.multitenancy.enabled: false
#opensearch_security.multitenancy.tenants.preferred: ["Private", "Global"]
#opensearch_security.readonly_mode.roles: ["kibana_read_only"]

opensearch_security.cookie.secure: false

opensearch.ssl.certificate: /usr/share/opensearch-dashboards/config/certificates/client.pem
opensearch.ssl.key: /usr/share/opensearch-dashboards/config/certificates/client-key.pem
opensearch.ssl.certificateAuthorities: /usr/share/opensearch-dashboards/config/certificates/root-ca.pem      

# Set the value to true to enable multiple data source feature
data_source.enabled: true

# Set the value to true to enable workspace feature
workspace.enabled: false

# Set the value to true to enable explore feature
explore.enabled: true